    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},k,b(D.c));
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(_){
    err.textContent='That passphrase is not right.';
    btn.disabled=false;btn.textContent='Unlock';
    document.getElementById('p').select();
  }
