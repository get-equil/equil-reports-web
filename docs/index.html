<title>Equil — Monthly Report</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap');
:root{color-scheme:light;--bg:#FCFCF7;--card:#ffffff;--line:#e3e3de;--ink:#1D3B1E;
 --muted:#6b6a65;--gold:#E7B721;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --bg:#111110;--card:#1a1a19;--line:#33332f;--ink:#f4f4f1;--muted:#96958c;--bad:#e66767}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111110;--card:#1a1a19;--line:#33332f;
 --ink:#f4f4f1;--muted:#96958c;--bad:#e66767}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
 color:var(--ink);font:15px/1.55 'Work Sans',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;padding:24px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
 border-radius:12px;padding:30px 28px}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 22px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
 color:var(--muted);margin-bottom:7px}
input{width:100%;padding:11px 13px;font:inherit;background:var(--bg);color:var(--ink);
 border:1px solid var(--line);border-radius:8px}
input:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:transparent}
button{width:100%;margin-top:12px;padding:11px;font:inherit;font-weight:600;cursor:pointer;
 background:var(--gold);color:#1D3B1E;border:1px solid var(--gold);border-radius:8px}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{color:var(--bad);font-size:13px;margin-top:11px;min-height:18px}
.foot{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);
 font-size:12px;color:var(--muted)}
</style></head><body>
<form class="box" id="f">
  <h1>Equil — Monthly Report</h1>
  <p class="sub">January – September 2026. This page is encrypted; enter the passphrase to read it.</p>
  <label for="p">Passphrase</label>
  <input id="p" type="password" autocomplete="current-password" autofocus>
  <button id="b" type="submit">Unlock</button>
  <div class="err" id="e" role="alert"></div>
  <div class="foot">Commercial in confidence. Figures are decrypted in your browser — nothing is sent anywhere.</div>
</form>
